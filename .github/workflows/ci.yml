name: Validate Docker Build & Compose Config

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  docker-validation:
    name: Validate Docker Build & Compose Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar configuración de Docker Compose
        run: docker compose config

      - name: Construir e iniciar contenedores
        run: docker compose up -d --build

      - name: Validar migraciones pendientes en Django
        run: docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas unitarias de Django
        run: docker compose exec -T backend python manage.py test

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build frontend (Typecheck & Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Detener servicios
        if: always()
        run: docker compose down
