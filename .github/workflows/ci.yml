name: CI Baseline Pipeline

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  docker-validation:
    name: Validate Docker Build & Compose Config
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Crear archivo .env temporal para build
        run: cp .env.example .env

      - name: Validar sintaxis de docker-compose.yml
        run: docker compose config

      - name: Compilar imágenes en Docker
        run: docker compose build

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend (Typecheck & Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Pruebas unitarias del frontend
        working-directory: ./frontend
        run: npm test

      - name: Iniciar base de datos
        run: docker compose up -d --wait db

      - name: Pruebas unitarias e integración del backend
        run: docker compose run --rm backend python manage.py test tests.unit.shooter tests.integration.shooter

      - name: Iniciar backend para E2E
        run: |
          docker compose up -d backend
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8000/api/v1/health/

      - name: Instalar navegador de pruebas
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E del módulo shooter
        working-directory: ./frontend
        env:
          SHOOTER_E2E_LIVE: '1'
        run: npm run test:e2e

      - name: Detener servicios
        if: always()
        run: docker compose down
