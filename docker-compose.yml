services:
  db:
    image: postgres:15-alpine
    container_name: gamestore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gamestore_db}
      POSTGRES_USER: ${DB_USER:-gamestore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gamestore_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gamestore_user} -d ${DB_NAME:-gamestore_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: gamestore_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DEBUG=1
      - DB_NAME=${DB_NAME:-gamestore_db}
      - DB_USER=${DB_USER:-gamestore_user}
      - DB_PASSWORD=${DB_PASSWORD:-gamestore_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gamestore_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: